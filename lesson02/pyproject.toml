[project]
name = "teacher-assistant-lesson02"
version = "0.2.0"
description = "Занятие 2: реестр инструментов — python eval, SymPy, z3"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "sympy>=1.12",
    "z3-solver>=4.12",
]

[project.scripts]
agent = "agent.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
